<path d="M40 732 H1160" stroke="#e0e7ec"/>
<text font-family="sans-serif" x="40" y="834" font-size="19" font-weight="700" text-anchor="start" fill="#17232b">Face view, not wire-entry view. Match the key before identifying contacts.</text>
