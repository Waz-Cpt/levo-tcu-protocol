<text font-family="sans-serif" x="1070" y="271" font-size="20" font-weight="400" text-anchor="start" fill="#17232b">GND</text>
<text font-family="sans-serif" x="1070" y="371" font-size="20" font-weight="400" text-anchor="start" fill="#17232b">3V3 output</text>
<text font-family="sans-serif" x="1070" y="471" font-size="20" font-weight="400" text-anchor="start" fill="#17232b">GPIO17 → CAN transmit</text>
