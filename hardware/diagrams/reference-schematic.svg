<text font-family="sans-serif" x="50" y="1110" font-size="18" font-weight="400" text-anchor="start" fill="#17232b">R1, R3, R4: 0.25 W or greater. R2: 0.5 W. 1% resistors make sensible new-build defaults.</text>
<text font-family="sans-serif" x="50" y="1138" font-size="18" font-weight="400" text-anchor="start" fill="#52616b">Reference wiring for the tested harness. Verify connector family, keying and continuity on your own pigtails.</text>
