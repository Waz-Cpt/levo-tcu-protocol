<text font-family="sans-serif" x="1070" y="600" font-size="18" font-weight="400" text-anchor="start" fill="#17232b">172 × 320 screen and touch</text>
<text font-family="sans-serif" x="1070" y="630" font-size="18" font-weight="400" text-anchor="start" fill="#17232b">are already on this board.</text>
<text font-family="sans-serif" x="1070" y="660" font-size="18" font-weight="700" text-anchor="start" fill="#17232b">Leave the microSD slot empty.</text>
