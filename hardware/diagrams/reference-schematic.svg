<text font-family="sans-serif" x="66" y="195" font-size="17" font-weight="400" text-anchor="start" fill="#52616b">5-pin MALE on replacement</text>
<text font-family="sans-serif" x="68" y="222" font-size="20" font-weight="400" text-anchor="start" fill="#17232b">1   Switched ~12 V</text>
<polyline points="320,215 350,215" fill="none" stroke="#17232b" stroke-width="2.5"/>
<text font-family="sans-serif" x="68" y="272" font-size="20" font-weight="400" text-anchor="start" fill="#17232b">2   Ground</text>
<polyline points="320,265 350,265" fill="none" stroke="#17232b" stroke-width="2.5"/>
<text font-family="sans-serif" x="68" y="322" font-size="20" font-weight="400" text-anchor="start" fill="#17232b">3   CAN H</text>
<polyline points="320,315 350,315" fill="none" stroke="#17232b" stroke-width="2.5"/>
<text font-family="sans-serif" x="68" y="372" font-size="20" font-weight="400" text-anchor="start" fill="#17232b">4   CAN L</text>
<polyline points="320,365 350,365" fill="none" stroke="#17232b" stroke-width="2.5"/>
<text font-family="sans-serif" x="68" y="422" font-size="20" font-weight="400" text-anchor="start" fill="#17232b">5   Wake / pack-level</text>
