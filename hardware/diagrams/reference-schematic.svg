<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160" role="img" aria-labelledby="title desc">
<title id="title">Levo TCU reference wiring schematic</title>
<desc id="desc">Five-pin male bike connector, six-pin female remote connector, 12-to-5 volt buck, Waveshare ESP32-C6 display and a 3.3 volt CAN transceiver. Pin numbering follows the separate mating-face drawings. Named nets connect electrically; no wire colors are specified.</desc>
<rect width="1500" height="1160" fill="white"/>
<text font-family="sans-serif" x="50" y="48" font-size="34" font-weight="700" text-anchor="start" fill="#17232b">Levo TCU · reference wiring</text>
<text font-family="sans-serif" x="50" y="82" font-size="20" font-weight="400" text-anchor="start" fill="#17232b">Module-level schematic · no cable-color assumptions · use the keyed mating-face pinout drawings</text>
<text font-family="sans-serif" x="50" y="110" font-size="18" font-weight="400" text-anchor="start" fill="#52616b">Matching net labels are connected. Dots mark junctions. U2A and U2B are the same ESP32 board.</text>
