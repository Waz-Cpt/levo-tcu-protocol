name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test.py
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py build
